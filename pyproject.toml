[project]
name = "mdv"
version = "0.1.0"
description = "Terminal markdown viewer with faithful rendering of GFM and its common extensions"
requires-python = ">=3.10"
dependencies = ["rich>=13", "markdown-it-py>=3", "mdit-py-plugins>=0.4"]

[project.scripts]
mdv = "mdv.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
